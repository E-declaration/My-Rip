<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>My RiP</title>
  <meta name="description" content="تحويل CCP إلى RIP بسهولة"/>
  <meta name="theme-color" content="#b8cef0"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/main.css"/>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-icons">
      <button class="header-btn" onclick="openSidebar()" aria-label="menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
    <div class="header-title" data-i18n="tool_ccp_rip">My RIP</div>
  </header>

  <!-- MAIN -->
  <main class="main-content">
    <div style="display:flex;flex-direction:column;gap:0;">

      <!-- Account Number -->
      <div class="input-group">
        <span class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7H3a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/><rect x="7" y="3" width="10" height="6" rx="1"/></svg>
        </span>
        <input type="number" id="ccpInput" data-i18n-ph="account_number" placeholder="رقم الحساب الجاري" inputmode="numeric" maxlength="10"/>
        <span class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6"/><path d="M9 12h6"/><path d="M9 15h4"/></svg>
        </span>
      </div>

      <!-- CCP Key -->
      <div class="input-group">
        <span class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5l3 3L22 7l-3-3"/></svg>
        </span>
        <input type="number" id="ccpKeyInput" data-i18n-ph="ccp_key" placeholder="مفتاح CCP" inputmode="numeric" readonly/>
        <span class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5l3 3L22 7l-3-3"/></svg>
        </span>
      </div>

      <!-- RIP Key -->
      <div class="input-group">
        <span class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5l3 3L22 7l-3-3"/></svg>
        </span>
        <input type="number" id="ripKeyInput" data-i18n-ph="rip_key" placeholder="مفتاح RIP" inputmode="numeric" readonly/>
        <span class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5l3 3L22 7l-3-3"/></svg>
        </span>
      </div>

      <!-- RIP Result -->
      <div class="result-box" id="ripResultBox" onclick="copyRip()">
        <span class="result-text" id="ripResult" data-i18n="rip_result">RIP: 007 99999 XXXXXXXXXX YY</span>
        <span class="input-icon" style="margin-right:0;margin-left:8px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg>
        </span>
      </div>

      <!-- Save Button -->
      <button class="btn btn-success" onclick="openSaveModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span data-i18n="save_account">حفظ الحساب</span>
      </button>

    </div>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="navigateTo('index.html')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span data-i18n="home">الرئيسية</span>
    </button>
    <button class="nav-item" onclick="navigateTo('pages/accounts.html')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span data-i18n="accounts">الحسابات</span>
    </button>
    <button class="nav-item" onclick="navigateTo('pages/settings.html')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span data-i18n="settings">الإعدادات</span>
    </button>
  </nav>

</div>

<!-- SIDEBAR OVERLAY -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <img src="icons/icon-192.png" alt="My RiP" class="sidebar-logo"/>
    <div class="sidebar-app-name">My RiP</div>
    <div class="sidebar-version" data-i18n="free_version"></div>
  </div>
  <div class="sidebar-menu">
    <div class="sidebar-section-title" data-i18n="tools">الأدوات</div>
    <button class="sidebar-item active" onclick="navigateTo('../index.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      <span data-i18n="tool_ccp_rip">CCP To RIP</span>
    </button>
    <div class="sidebar-divider"></div>
    <button class="sidebar-item" onclick="navigateTo('pages/settings.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span data-i18n="sidebar_settings">إعدادات التطبيق</span>
    </button>
    <button class="sidebar-item" onclick="navigateTo('pages/about.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span data-i18n="about">حول التطبيق</span>
    </button>
    <button class="sidebar-item" onclick="navigateTo('pages/privacy.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span data-i18n="privacy">سياسة الخصوصية</span>
    </button>
  </div>
</aside>

<!-- SAVE MODAL -->
<div class="modal-overlay" id="saveModal">
  <div class="modal">
    <div class="modal-title" data-i18n="save_account">حفظ الحساب</div>
    <div class="input-group">
      <span class="input-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </span>
      <input type="text" id="nameInput" data-i18n-ph="name_placeholder" placeholder="اللقب و الإسم"/>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeSaveModal()" style="flex:1;">
        <span data-i18n="cancel">إلغاء</span>
      </button>
      <button class="btn btn-success" onclick="doSaveAccount()" style="flex:1;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span data-i18n="save_account">حفظ</span>
      </button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
  // ===== HOME PAGE LOGIC =====
  const ccpInput = document.getElementById('ccpInput');
  const ccpKeyInput = document.getElementById('ccpKeyInput');
  const ripKeyInput = document.getElementById('ripKeyInput');
  const ripResult = document.getElementById('ripResult');
  let currentRIP = '';

  ccpInput.addEventListener('input', () => {
    const val = ccpInput.value.replace(/\D/g, '').slice(0, 10);
    ccpInput.value = val;
    if (val.length === 10) {
      const ck = calcCCPKey(val);
      const rk = calcRIPKey(val);
      const rip = buildRIP(val, rk);
      ccpKeyInput.value = ck;
      ripKeyInput.value = rk;
      currentRIP = rip;
      ripResult.textContent = 'RIP: ' + formatRIPDisplay(rip);
      ripResult.classList.add('has-value');
    } else {
      ccpKeyInput.value = '';
      ripKeyInput.value = '';
      currentRIP = '';
      ripResult.textContent = t('rip_result');
      ripResult.classList.remove('has-value');
    }
  });

  function copyRip() {
    if (currentRIP) copyText(currentRIP);
  }

  function openSaveModal() {
    if (!currentRIP) { showToast(t('fill_fields')); return; }
    document.getElementById('saveModal').classList.add('open');
    document.getElementById('nameInput').focus();
  }

  function closeSaveModal() {
    document.getElementById('saveModal').classList.remove('open');
  }

  function doSaveAccount() {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) { showToast(t('fill_fields')); return; }
    const ccp = ccpInput.value;
    const ck = ccpKeyInput.value;
    const rk = ripKeyInput.value;
    addAccount({ name, ccp, ccpKey: ck, ripKey: rk, rip: currentRIP });
    showToast(t('saved'));
    closeSaveModal();
    ccpInput.value = '';
    ccpKeyInput.value = '';
    ripKeyInput.value = '';
    currentRIP = '';
    ripResult.textContent = t('rip_result');
    ripResult.classList.remove('has-value');
    document.getElementById('nameInput').value = '';
  }

  // Close modal on overlay click
  document.getElementById('saveModal').addEventListener('click', function(e) {
    if (e.target === this) closeSaveModal();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
