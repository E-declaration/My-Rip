<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>My RiP – الحسابات</title>
  <meta name="theme-color" content="#b8cef0"/>
  <link rel="manifest" href="../manifest.json"/>
  <link rel="icon" type="image/x-icon" href="../favicon.ico"/>
  <link rel="icon" type="image/png" href="../icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="../icons/icon-192.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/main.css"/>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-icons">
      <button class="header-btn" onclick="openSidebar()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
    <div class="header-title" data-i18n="saved_accounts">الحسابات المحفوظة</div>
    <div class="header-icons">
      <button class="header-btn" id="searchToggleBtn" onclick="toggleSearch()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="header-btn" onclick="navigateTo('../index.html')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main-content">
    <div id="searchBar" class="search-bar" style="display:none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" data-i18n-ph="search_placeholder" placeholder="بحث..." oninput="renderAccounts()"/>
    </div>

    <div class="accounts-header" id="accountsHeader"></div>
    <div id="accountsList"></div>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item" onclick="navigateTo('../index.html')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span data-i18n="home">الرئيسية</span>
    </button>
    <button class="nav-item active" onclick="navigateTo('accounts.html')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span data-i18n="accounts">الحسابات</span>
    </button>
    <button class="nav-item" onclick="navigateTo('settings.html')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span data-i18n="settings">الإعدادات</span>
    </button>
  </nav>

</div>

<!-- SIDEBAR -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <img src="../icons/icon-192.png" alt="My RiP" class="sidebar-logo"/>
    <div class="sidebar-app-name">My RiP</div>
    <div class="sidebar-version" data-i18n="free_version">النسخة المجانية</div>
  </div>
  <div class="sidebar-menu">
    <div class="sidebar-section-title" data-i18n="tools">الأدوات</div>
    <button class="sidebar-item" onclick="navigateTo('../index.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      <span data-i18n="tool_ccp_rip">CCP To RIP</span>
    </button>
    <div class="sidebar-divider"></div>
    <button class="sidebar-item" onclick="navigateTo('settings.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span data-i18n="sidebar_settings">إعدادات التطبيق</span>
    </button>
    <button class="sidebar-item" onclick="navigateTo('about.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span data-i18n="about">حول التطبيق</span>
    </button>
    <button class="sidebar-item" onclick="navigateTo('privacy.html')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span data-i18n="privacy">سياسة الخصوصية</span>
    </button>
  </div>
</aside>

<!-- DELETE CONFIRM MODAL -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <div class="modal-title" data-i18n="confirm_delete">حذف الحساب</div>
    <p style="color:var(--text2);font-size:0.9rem;" data-i18n="confirm_delete_msg">هل أنت متأكد من حذف هذا الحساب؟</p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeDeleteModal()" style="flex:1;" data-i18n="cancel">إلغاء</button>
      <button class="btn btn-danger" onclick="confirmDelete()" style="flex:1;" data-i18n="delete">حذف</button>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-title" data-i18n="edit">تعديل</div>
    <div class="input-group">
      <span class="input-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </span>
      <input type="text" id="editNameInput" data-i18n-ph="name_placeholder" placeholder="اللقب و الإسم"/>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeEditModal()" style="flex:1;" data-i18n="cancel">إلغاء</button>
      <button class="btn btn-success" onclick="confirmEdit()" style="flex:1;" data-i18n="confirm">تأكيد</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="../js/i18n.js"></script>
<script src="../js/app.js"></script>
<script>
  let pendingDeleteId = null;
  let pendingEditId = null;

  function toggleSearch() {
    const bar = document.getElementById('searchBar');
    const hidden = bar.style.display === 'none';
    bar.style.display = hidden ? 'flex' : 'none';
    if (hidden) document.getElementById('searchInput').focus();
    else { document.getElementById('searchInput').value = ''; renderAccounts(); }
  }

  function renderAccounts() {
    const all = getAccounts();
    const query = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
    const filtered = query ? all.filter(a =>
      a.name.toLowerCase().includes(query) ||
      a.ccp.includes(query) ||
      a.rip.includes(query)
    ) : all;

    const header = document.getElementById('accountsHeader');
    header.textContent = t('total_accounts') + ' ' + all.length;

    const list = document.getElementById('accountsList');
    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          <p data-i18n="no_accounts">${t('no_accounts')}</p>
          <p style="font-size:0.8rem;" data-i18n="no_accounts_sub">${t('no_accounts_sub')}</p>
        </div>`;
      return;
    }

    const ripFormatted = (rip) => rip.slice(0,3)+' '+rip.slice(3,8)+' '+rip.slice(8,18)+' '+rip.slice(18);

    list.innerHTML = filtered.map(a => `
      <div class="account-card">
        <div class="account-row">
          <span class="account-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            ${t('name_label')}
          </span>
          <span class="account-value">${a.name}</span>
        </div>
        <div class="account-row">
          <span class="account-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            ${t('account_label')}
          </span>
          <span class="account-value">${a.ccp}</span>
        </div>
        <div class="account-row">
          <span class="account-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5l3 3L22 7l-3-3"/></svg>
            ${t('ccp_key_label')}
          </span>
          <span class="account-value">${a.ccpKey}</span>
          <span style="margin:0 8px;color:var(--text2);">|</span>
          <span class="account-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5l3 3L22 7l-3-3"/></svg>
            ${t('rip_key_label')}
          </span>
          <span class="key-badge">${a.ripKey}</span>
        </div>
        <div class="account-row" style="align-items:flex-start;">
          <span class="account-label" style="margin-top:2px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg>
            ${t('rip_label')}
          </span>
          <span class="rip-value">${ripFormatted(a.rip)}</span>
        </div>
        <div class="account-actions">
          <button class="btn-icon" onclick='copyText("${a.rip}")' title="${t('copy')}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button class="btn-icon" onclick='shareText("${a.rip}", "${a.name}")' title="${t('share')}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          </button>
          <button class="btn-icon" onclick="openEdit(${a.id}, '${a.name.replace(/'/g,"\\'")}')">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn-icon" onclick="openDelete(${a.id})" style="color:#dc2626;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
          <span class="account-date">${a.date || ''}</span>
        </div>
      </div>
    `).join('');
  }

  function openDelete(id) {
    pendingDeleteId = id;
    document.getElementById('deleteModal').classList.add('open');
  }
  function closeDeleteModal() {
    document.getElementById('deleteModal').classList.remove('open');
    pendingDeleteId = null;
  }
  function confirmDelete() {
    if (pendingDeleteId) {
      deleteAccount(pendingDeleteId);
      closeDeleteModal();
      showToast(t('deleted'));
      renderAccounts();
    }
  }

  function openEdit(id, name) {
    pendingEditId = id;
    document.getElementById('editNameInput').value = name;
    document.getElementById('editModal').classList.add('open');
  }
  function closeEditModal() {
    document.getElementById('editModal').classList.remove('open');
    pendingEditId = null;
  }
  function confirmEdit() {
    const name = document.getElementById('editNameInput').value.trim();
    if (!name) return;
    updateAccount(pendingEditId, { name });
    closeEditModal();
    showToast(t('updated'));
    renderAccounts();
  }

  document.getElementById('deleteModal').addEventListener('click', function(e){ if(e.target===this) closeDeleteModal(); });
  document.getElementById('editModal').addEventListener('click', function(e){ if(e.target===this) closeEditModal(); });

  renderAccounts();
</script>
</body>
</html>
